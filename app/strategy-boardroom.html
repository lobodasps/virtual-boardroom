<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Strategy Boardroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed records rail (left) + minutes of the meeting (right); stacks on phones. */
:root{
  --bg:#EEF0EE; --surface:#FFFFFF; --sunk:#E4E7E4; --ink:#15191C; --muted:#5A646C; --line:#D3D8D5;
  --accent:#1F6F64; --accent-ink:#FFFFFF; --accent-soft:#D9ECE8;
  --good:#2C7A47; --warn:#A86A06; --bad:#B23A32; --flag:#FFF1C2; --flag-ink:#6B4B00;
  /* SPEC:COLORS:BEGIN */
  --c-titan:#2F5D9E; --c-developer:#946311; --c-hawk:#A23B3B; --c-technologist:#6A4CA3; --c-allocator:#2E7D4F; --c-maverick:#5B8A1F; --c-warden:#7A5A44; --c-counsel:#36424D;
  --c-x1:#8A3B7A; --c-x2:#B05A1A; --c-x3:#1E7A8C; --c-x4:#6B6B2A; --c-x5:#9C2F5E; --c-x6:#3E4FA3;
  /* SPEC:COLORS:END */
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-read:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101315; --surface:#181C1F; --sunk:#0C0E10; --ink:#E6EAEC; --muted:#98A2AA; --line:#2B3136;
  --accent:#55B8A8; --accent-ink:#0B1714; --accent-soft:#16312C;
  --good:#5DBB7E; --warn:#E2A53A; --bad:#E2716A; --flag:#3A3010; --flag-ink:#F3D37A;
  /* SPEC:COLORS-DARK:BEGIN */
  --c-titan:#7FA6E0; --c-developer:#D9A84C; --c-hawk:#E07A7A; --c-technologist:#A98EE0; --c-allocator:#6CC08E; --c-maverick:#9CCB5E; --c-warden:#C29F86; --c-counsel:#9AA8B5;
  --c-x1:#D58BC6; --c-x2:#E89A5C; --c-x3:#6CC5D6; --c-x4:#C2C27A; --c-x5:#E07FA8; --c-x6:#8F9CE6;
  /* SPEC:COLORS-DARK:END */
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101315; --surface:#181C1F; --sunk:#0C0E10; --ink:#E6EAEC; --muted:#98A2AA; --line:#2B3136;
  --accent:#55B8A8; --accent-ink:#0B1714; --accent-soft:#16312C;
  --good:#5DBB7E; --warn:#E2A53A; --bad:#E2716A; --flag:#3A3010; --flag-ink:#F3D37A;
  /* SPEC:COLORS-DARK:BEGIN */
  --c-titan:#7FA6E0; --c-developer:#D9A84C; --c-hawk:#E07A7A; --c-technologist:#A98EE0; --c-allocator:#6CC08E; --c-maverick:#9CCB5E; --c-warden:#C29F86; --c-counsel:#9AA8B5;
  --c-x1:#D58BC6; --c-x2:#E89A5C; --c-x3:#6CC5D6; --c-x4:#C2C27A; --c-x5:#E07FA8; --c-x6:#8F9CE6;
  /* SPEC:COLORS-DARK:END */
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100%}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}

/* Rail */
.rail{border-right:1px solid var(--line);background:var(--surface);padding:20px 16px;display:flex;flex-direction:column;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
@media (max-width:900px){.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-stretch:75%;font-weight:800;font-size:22px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.rail-actions{display:flex;gap:8px;flex-wrap:wrap}
.hist{display:flex;flex-direction:column;gap:2px}
.hist h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 6px;font-weight:600}
.hitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;padding:8px;border-radius:var(--r);cursor:pointer;border:1px solid transparent;text-align:left;background:none;width:100%}
.hitem:hover{background:var(--sunk)}
.hitem.on{border-color:var(--line);background:var(--bg)}
.hitem .t{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.hitem .s{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:2px}
.hitem input{margin-top:3px}
.empty-note{color:var(--muted);font-size:13px;padding:8px;border:1px dashed var(--line);border-radius:var(--r)}

/* Main */
#banner .notice{margin:16px clamp(16px,4vw,48px) 0;max-width:1084px}
.main{padding-block:24px 64px;padding-inline:clamp(16px,4vw,48px);min-width:0;max-width:1180px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-stretch:85%;font-weight:750;font-size:clamp(24px,3.2vw,34px);line-height:1.1;margin:6px 0 8px;text-wrap:balance}
h2{font-stretch:90%;font-weight:700;font-size:19px;margin:0 0 10px;text-wrap:balance}
h4{font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 6px;font-weight:700;color:var(--muted)}
.lede{font-family:var(--f-read);font-size:17px;max-width:68ch;color:var(--ink)}
.sec{margin-top:28px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Form */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
@media (max-width:700px){.form{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-weight:650;font-size:13px}
.field small{color:var(--muted);font-size:12px}
.field input[type=text],.field textarea,.field select{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%}
.field textarea{min-height:84px;resize:vertical;font-family:var(--f-display)}
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg label{padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--accent)}
.seg label:has(input:checked){background:var(--accent-soft)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}

/* Roster */
.roster{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
@media (max-width:1100px){.roster{grid-template-columns:repeat(4,minmax(0,1fr))}}
.seat{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.seat .nm{font-weight:650;font-size:12.5px;line-height:1.2}
.seat .ln{font-family:var(--f-read);font-size:12.5px;color:var(--muted);font-style:italic;line-height:1.3}
.seat.speaking{border-color:var(--who)}
.seat.speaking::after{content:"speaking";position:absolute;top:8px;right:8px;font-family:var(--f-mono);font-size:10px;color:var(--who)}
.seat.nv{background:var(--sunk)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--surface);background:var(--who);flex:none}

/* Pipeline */
.pipe{display:flex;flex-wrap:wrap;gap:6px;counter-reset:item}
.pi{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-size:12px;background:var(--surface)}
.pi::before{counter-increment:item;content:counter(item);font-family:var(--f-mono);font-size:10px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.pi.done::before{background:var(--accent);color:var(--accent-ink);content:"✓"}
.pi.now{border-color:var(--accent);color:var(--accent);font-weight:650}
.pi.now::before{background:var(--accent-soft);color:var(--accent)}
.pi.skip{opacity:.55;text-decoration:line-through}

.statuspill{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.st-complete{color:var(--good);border-color:currentColor}
.st-running,.st-planning{color:var(--accent);border-color:currentColor}
.st-interrupted{color:var(--bad);border-color:currentColor}
.st-research_requested,.st-plan_ready{color:var(--warn);border-color:currentColor}

.notice{border-left:3px solid var(--warn);background:var(--surface);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;margin-top:14px}
.notice.bad{border-color:var(--bad)}

/* Plan editor */
.pm{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;border-top:1px solid var(--line);padding-block:12px}
.pm:first-of-type{border-top:0}
.pm .q{font-size:13px;color:var(--muted)}
.pm ul{margin:4px 0 0 18px;padding:0}
.pestle-tags{display:flex;gap:4px;flex-wrap:wrap}
.ptag{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:3px;background:var(--sunk);color:var(--muted)}

/* Evidence */
.mkt-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;background:var(--surface);font-weight:600}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pestle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:800px){.pestle{grid-template-columns:minmax(0,1fr)}}
.pc{background:var(--surface);padding:12px;min-width:0}
.pc .k{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.pc .k b{font-family:var(--f-mono);font-size:20px;font-weight:500;color:var(--accent);line-height:1}
.pc .k span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.pc ul{margin:0;padding-left:16px;font-family:var(--f-read);font-size:14px}
.pc li{margin-bottom:5px}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:650}
td.n{font-family:var(--f-mono);text-align:center;font-variant-numeric:tabular-nums}
.sc{display:inline-grid;place-items:center;width:26px;height:22px;border-radius:3px;background:color-mix(in srgb,var(--accent) calc(var(--v)*18%),transparent);font-weight:500}
.reg td:first-child{font-family:var(--f-mono);white-space:nowrap}
.reg td.src{font-size:12px;color:var(--muted);min-width:180px}
.gap{border-left:3px solid var(--warn);padding:6px 10px;margin:6px 0;background:var(--bg)}
details>summary{cursor:pointer;font-weight:650;padding:6px 0}

/* Transcript */
.stage-div{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.stage-div::after{content:"";flex:1;border-top:1px solid var(--line)}
.stage-div span{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.turn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
.turn.counsel{background:var(--sunk)}
.turn.live{border-style:dashed}
.th{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.th .who{font-weight:700;color:var(--who)}
.th .role{font-size:12px;color:var(--muted)}
.th .tgt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.headline{font-weight:650;margin:6px 0 4px;font-size:14.5px}
.body{font-family:var(--f-read);font-size:15.5px;line-height:1.55;max-width:72ch}
.body p{margin:0 0 9px}
.body ul,.body ol{margin:0 0 9px;padding-left:20px}
.body h4{font-family:var(--f-display)}
.claim{border-left:3px solid var(--who);padding:4px 10px;margin:6px 0;font-family:var(--f-read);font-style:italic;color:var(--muted)}
.question{margin-top:6px;font-weight:650}
.tf{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-family:var(--f-mono);font-size:10.5px;padding:2px 7px;border-radius:3px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.pursue{color:var(--good)}.tag.test{color:var(--warn)}.tag.avoid{color:var(--bad)}
.tag.flag{background:var(--flag);color:var(--flag-ink);border-color:transparent}
a.fref{font-family:var(--f-mono);font-size:.78em;text-decoration:none;padding:0 3px;border-radius:3px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
a.fref.bad{background:var(--flag);color:var(--flag-ink)}
.uncited{background:linear-gradient(transparent 62%,var(--flag) 62%)}
.verify{font-family:var(--f-mono);font-size:.75em;background:var(--flag);color:var(--flag-ink);padding:0 4px;border-radius:3px}
.cursor::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor::after{animation:none}}

/* Votes */
.tally{display:flex;height:26px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);margin:10px 0 6px}
.tally div{display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--accent-ink);background:var(--accent);min-width:0;overflow:hidden;white-space:nowrap}
.tally div:nth-child(2){background:color-mix(in srgb,var(--accent) 60%,var(--muted))}
.tally div:nth-child(3){background:var(--muted)}
.tally div:nth-child(n+4){background:color-mix(in srgb,var(--muted) 60%,var(--line))}
.votes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.vote{border:1px solid var(--line);border-top:3px solid var(--who);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.vote .ch{font-weight:700;font-size:15px;line-height:1.25}
.vote .rat{font-family:var(--f-read);font-size:14px}
.vote ul{margin:0;padding-left:16px;font-size:12.5px}
.sup{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:3px}
.sup.strong{background:var(--accent-soft);color:var(--accent)}
.sup.conditional{background:var(--flag);color:var(--flag-ink)}

/* Synthesis */
.resolution{font-family:var(--f-read);font-size:21px;line-height:1.35;font-weight:500;border-left:4px solid var(--accent);padding:4px 0 4px 16px;margin:4px 0 14px;text-wrap:pretty}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.cols ul{margin:0;padding-left:18px;font-family:var(--f-read);font-size:15px}
.cols li{margin-bottom:6px}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.path{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--bg)}
.path b{font-size:15px}
.sev{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:3px;text-transform:uppercase}
.sev.high{background:var(--bad);color:#fff}.sev.medium{background:var(--flag);color:var(--flag-ink)}.sev.low{background:var(--sunk);color:var(--muted)}

/* Compare */
.cmp th{position:sticky;top:0;background:var(--surface)}
.cmp td{min-width:180px}
.cmp td:first-child,.cmp th:first-child{min-width:150px;font-weight:650}

.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.dcard{border:1px solid var(--line);border-top:3px solid var(--who);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dcard .ln{font-family:var(--f-read);font-style:italic;color:var(--muted);font-size:14px}
.dcard .acts{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.seats{display:flex;flex-wrap:wrap;gap:6px}
.seat-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;cursor:pointer;font-size:12.5px;font-weight:600;background:var(--surface)}
.seat-chip:has(input:checked){border-color:var(--who);background:color-mix(in srgb,var(--who) 12%,var(--surface))}
.seat-chip input{accent-color:var(--who);margin:0}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:50%;background:var(--who);border:2px solid var(--surface);outline:1px solid var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed=true]{outline:2px solid var(--ink)}
.att{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.att .nm{font-weight:600;overflow-wrap:anywhere}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin:6px 0 2px}
.meter div{height:100%;background:var(--accent)}
.meter.over div{background:var(--warn)}
a.aref{font-family:var(--f-mono);font-size:.78em;text-decoration:none;padding:0 3px;border-radius:3px;background:color-mix(in srgb,var(--accent) 10%,var(--sunk));color:var(--ink);white-space:nowrap;border:1px dashed var(--line)}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.vlabel{font-family:var(--f-mono);font-weight:500;font-size:13px;padding:5px 10px;border-radius:4px;color:#fff;background:var(--muted);letter-spacing:.03em}
.vlabel.GO{background:var(--good)}.vlabel.GOC{background:var(--accent)}.vlabel.RESHAPE{background:var(--warn)}.vlabel.NO{background:var(--bad)}.vlabel.HOLD{background:var(--muted)}
.obar{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr) 36px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.obar .t{height:12px;background:var(--sunk);border-radius:3px;overflow:hidden}.obar .t div{height:100%;background:var(--accent)}
.obar.rec .t div{background:var(--good)}
.mism{text-decoration:underline dotted var(--bad);text-underline-offset:3px}
.crux{border-left:3px solid var(--c-counsel);padding:6px 10px;margin:6px 0;background:var(--bg);font-size:14px}
.intro-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;counter-reset:st}
.intro-steps div{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);font-size:13px}
.intro-steps div::before{counter-increment:st;content:"Step " counter(st);display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--accent);margin-bottom:4px;letter-spacing:.05em;text-transform:uppercase}
.copybox{display:flex;gap:8px;align-items:stretch;margin-top:10px;flex-wrap:wrap}
/* Print: the session page only, light colors, nothing interactive; beforeprint opens every <details>. */
@media print{
  .rail,#banner,#sv-ctrl,#sv-pipe,#sv-seats,#sv-research,.btn,.mkt-chips,.copybox{display:none!important}
  .app{display:block}
  .main{max-width:none;padding:0}
  body{background:#fff;font-size:12px}
  .panel,.turn,.vote,.path,.dcard,.pc{break-inside:avoid}
  h1,h2,h4,.stage-div{break-after:avoid}
  a{color:inherit;text-decoration:none}
  .seat.speaking::after,.cursor::after{display:none}
}
.copybox pre{flex:1;min-width:0;margin:0;font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;white-space:pre-wrap;overflow:auto;max-height:260px}
.copybox code{flex:1;min-width:0;font-family:var(--f-mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;overflow-wrap:anywhere;user-select:all}

inely conflicting directions, not variations of one.",

const Store = {
  kind:"loading", db:null, mem:new Map(), subs:new Map(), q:new Map(),
  async init(){ const db = await use("db"); if(db){ this.db=db; this.kind="db"; } else { this.kind="memory"; } },
  _m(col){ if(!this.mem.has(col)) this.mem.set(col,new Map()); return this.mem.get(col); },
  _n(col){ (this.subs.get(col)||new Set()).forEach(f=>f()); },
  _sub(col,f){ if(!this.subs.has(col)) this.subs.set(col,new Set()); this.subs.get(col).add(f); f(); return ()=>this.subs.get(col).delete(f); },
  watchCol(col, cb, order){
    if(this.db){ let q=this.db.collection(col); if(order) q=q.orderBy(order,"desc").limit(300);
      return q.onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))), e=>showNotice("Could not load saved records ("+e.code+")."));}
    return this._sub(col,()=>{ let a=[...this._m(col).values()]; if(order) a.sort((x,y)=>(y[order]||0)-(x[order]||0)); cb(a); });
  },
  watchDoc(col,id,cb){
    if(this.db) return this.db.doc(col+"/"+id).onSnapshot(d=>cb(d.exists?d.data():null), e=>showNotice("Could not load a saved record ("+e.code+")."));
    return this._sub(col,()=>cb(this._m(col).get(id)||null));
  },
  async list(col){
    if(this.db){ const r=await this.db.collection(col).get(); return r.docs.map(d=>({id:d.id,...d.data()})); }
    return [...this._m(col).values()];
  },
  chain(key,fn){ const p=(this.q.get(key)||Promise.resolve()).catch(()=>{}).then(fn); this.q.set(key,p); return p; },
  put(col,id,data){ const body=JSON.parse(JSON.stringify(data)); delete body.id;
    return this.chain(col+"/"+id, async()=>{ if(this.db) return this.db.doc(col+"/"+id).set(body); this._m(col).set(id,{id,...body}); this._n(col); }); },
  del(col,id){ return this.chain(col+"/"+id, async()=>{ if(this.db) return this.db.doc(col+"/"+id).delete(); this._m(col).delete(id); this._n(col); }); },
  watchSessions(cb){ return this.watchCol("sessions",cb,"updatedAt"); },

/* ───────────────────────── Text helpers ───────────────────────── */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FIG = /(\$\s?\d|\b\d[\d,.]*\s?(%|percent\b|million\b|billion\b|bn\b|mm\b|[MBK]\b))/i;
/* A token is a citation only if it is F<n> or a real material tag; [CO2], [I95] and [NJ1] are not. */
const isTag = id => /^F\d+$/.test(id) || !!state.attIndex[id];
const knownMono = id => { const m=String(id).match(/^([A-Z]{1,3})\d+$/); return !!m && Object.values(byId).some(p=>p&&p.mono===m[1]); };
function citeIds(s){ return [...String(s).matchAll(/\[([^\]]+)\]/g)].flatMap(m=>m[1].split(/\s*[,;]\s*/)).map(x=>x.trim()).filter(isTag); }
function factLink(id, facts){
  if(!/^F\d+$/.test(id)){ const a=state.attIndex[id];
    return a ? `<a class="aref" title="${esc("Briefing material: "+a.name+" ("+(byId[a.dir]?.title||"director")+")")}">${id}</a>` : `<a class="fref bad" title="Unknown citation">${id}?</a>`; }
  const f = facts && facts[id];
  if(!f) return `<a class="fref bad" title="Not in the evidence register">${id}?</a>`;
  return `<a class="fref" href="${esc(f.url||"#")}" target="_blank" rel="noopener" title="${esc(f.claim+" — "+(f.source||""))}">${id}</a>`;
}
function inl(raw, opt){
  let h = esc(raw);
  h = h.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  h = h.replace(/\[((?:F\d+|[A-Z]{1,3}\d+)(?:\s*[,;]\s*(?:F\d+|[A-Z]{1,3}\d+))*)\]/g,(m,ids)=>{ const L=ids.split(/\s*[,;]\s*/); if(!L.some(id=>isTag(id)||knownMono(id))) return m; return L.map(id=>isTag(id)||knownMono(id)?factLink(id,opt.facts):id).join(" "); });
  h = h.replace(/\[(VERIFY|UNVERIFIED|NOT FOUND)\]/gi,'<span class="verify">$1</span>');
  return h;
}
function nums(str){ return (String(str).match(/\d[\d,]*(?:\.\d+)?/g)||[]).map(x=>x.replace(/,/g,"")).filter(x=>{ const n=+x; if(/^\d{4}$/.test(x)&&n>=1900&&n<=2100) return false; return x.replace(/\D/g,"").length>=2||x.includes("."); }); }
function citedText(sent, facts){
  const ids=[...String(sent).matchAll(/\b(F\d+|[A-Z]{1,3}\d+)\b/g)].map(m=>m[1]).filter(isTag); const parts=[];
  ids.forEach(id=>{ if(/^F\d+$/.test(id)){ if(facts&&facts[id]) parts.push(facts[id].claim); } else if(state.attText[id]) parts.push(state.attText[id]); });
  return parts.length?parts.join(" ").replace(/,/g,""):null;
}
function para(lines, opt){
  const txt = lines.join(" ");
  if(!opt.flag) return `<p>${inl(txt,opt)}</p>`;
  const parts = txt.split(/(?<=[.!?])\s+/);
  return "<p>"+parts.map(s=>{
    const h=inl(s,opt);
    const cited=citeIds(s).length>0;
    if(FIG.test(s) && !cited){ opt.count=(opt.count||0)+1; return `<span class="uncited" title="Figure without an evidence citation">${h}</span>`; }
    if(FIG.test(s) && cited){ const src=citedText(s.match(/\[[^\]]*\]/g)?.join(" ")||"",opt.facts); const miss=src?nums(s.replace(/\[[^\]]*\]/g,"")).filter(n=>!src.includes(n)):[];
      if(miss.length){ opt.mismatch=(opt.mismatch||0)+1; return `<span class="mism" title="${esc("Couldn't find "+miss.join(", ")+" in the cited source. Check it.")}">${h}</span>`; } }
    return h;
  }).join(" ")+"</p>";
}
function md(text, opt={}){
  const lines = String(text||"").replace(/\r/g,"").split("\n");
  let out="", p=[], list=null;
  const flushP=()=>{ if(p.length){ out+=para(p,opt); p=[]; } };
  const flushL=()=>{ if(list){ out+=`<${list.t}>`+list.items.map(i=>`<li>${inl(i,opt)}</li>`).join("")+`</${list.t}>`; list=null; } };
  for(const l of lines){
    const t=l.trim();
    if(!t){ flushP(); flushL(); continue; }
    const h=t.match(/^#{1,4}\s+(.*)/);
    if(h){ flushP(); flushL(); out+=`<h4>${inl(h[1],opt)}</h4>`; continue; }
    const b=t.match(/^([-*•]|\d+[.)])\s+(.*)/);
    if(b){ flushP(); const ty=/\d/.test(b[1])?"ol":"ul"; if(!list||list.t!==ty){ flushL(); list={t:ty,items:[]}; } list.items.push(b[2]); continue; }
    flushL(); p.push(t);
  }
  flushP(); flushL();
  return out;
}
function splitMeta(text){
  const i = text.indexOf("<<<META");
  if(i<0) return {body:text.replace(/<{1,3}(M(E(T(A)?)?)?)?\s*$/,"").trim(), meta:null};
  const raw=text.slice(i+7); let meta=null;
  const a=raw.indexOf("{"), b=raw.lastIndexOf("}");
  if(a>=0 && b>a){ try{ meta=JSON.parse(raw.slice(a,b+1)); }catch(e){ meta=null; } }
  return {body:text.slice(0,i).trim(), meta};
}

function stageInfo(k){
  const fixed={cruxes:["Counsel's cruxes","Cruxes"],draft:["Draft resolution","Draft"],ratify:["Ratification (sealed)","Ratify"],brief:["Counsel's evidence brief","Brief"],opening:["Opening positions (sealed)","Openings"],redteam:["Red-team dissent","Red team"],vote:["Roll-call vote (sealed)","Vote"],synthesis:["Counsel's synthesis","Synthesis"]};

  if(m) return m[1]==="challenge"?{label:`Cross-examination, round ${m[2]}`,short:`Cross-exam ${m[2]}`}:{label:`Rebuttals, round ${m[2]}`,short:`Rebuttals ${m[2]}`};

}
const isRound = k => /^(challenge|response)\d+$/.test(k);
const roundsFor = depth => (RULES.stages[depth]||RULES.stages.standard).filter(k=>/^challenge\d+$/.test(k)).length;
function buildPlan(rounds, ratify, depth){
  const base=(RULES.stages[depth]||RULES.stages.standard).filter(k=>!isRound(k)), p=[];
  base.forEach(k=>{ if(k==="redteam"||(k==="vote"&&!base.includes("redteam"))) for(let i=1;i<=rounds;i++) p.push("challenge"+i,"response"+i);
    if(ratify && k===RULES.ratify.insert_before) p.push(...RULES.ratify.stages); p.push(k); });

/* Which materials a director gets in full, cut short, or only through search. Mirrored by scripts/materials.py;
   tests/test_data.mjs runs this block. items: [{tag,name,chars,text,pinned,shared,addedAt}]; budget in characters;
   tools: whether search_materials/read_material are available. Pinned items go first (oldest first); unpinned items
   fill what is left (smallest first). With tools, what doesn't fit is indexed for search; without, it is cut. */
function planMaterials(items, budget, tools){
  const len=a=>a.chars||String(a.text||"").length, full=[], cut=[], indexed=[]; let left=budget;
  const pinned=(items||[]).filter(a=>a.pinned).sort((a,b)=>(a.addedAt||0)-(b.addedAt||0));
  const rest=(items||[]).filter(a=>!a.pinned).sort((a,b)=>len(a)-len(b));
  pinned.forEach(a=>{ const n=len(a); if(n<=left){ full.push(a); left-=n; } else { if(left>0) cut.push({item:a,keep:left}); left=0; if(tools) indexed.push(a); } });
  if(tools) rest.forEach(a=>{ const n=len(a); if(n<=left){ full.push(a); left-=n; } else indexed.push(a); });
  else rest.forEach((a,i)=>{ const share=Math.floor(left/(rest.length-i)), n=len(a); if(n<=share){ full.push(a); left-=n; } else { if(share>0) cut.push({item:a,keep:share}); left-=share; } });
  const sum=l=>l.reduce((n,a)=>n+len(a),0), pinnedChars=sum(pinned);
  return {full, cut, indexed, pinnedChars, searchableChars:sum(indexed), overPinned:pinnedChars>budget};
}

const CARD_HEADING = /^(#{1,6}\s+\S.*|--- page \d+ ---|## Sheet: .*|[A-Z][A-Z0-9 &,'()\/-]{3,79})$/;
function cardSource(text, R, marker){
  const t=String(text||"").replace(/\r/g,""), max=R.cards.source_chars;
  if(t.length<=max) return {text:t, truncated:false, headings:0};
  const seen=new Set(), hs=[];
  for(const line of t.slice(max).split("\n")){ const l=line.trim(); if(l && CARD_HEADING.test(l) && !seen.has(l)){ seen.add(l); hs.push(l); if(hs.length>=R.cards.max_headings) break; } }
  return {text:t.slice(0,max)+"\n\n"+marker+"\n"+hs.join("\n"), truncated:true, headings:hs.length};
}
function validateCard(card, R){
  const t=String(card||"").trim(), n=t.length, issues=[];
  if(n<R.cards.min_chars) issues.push(`too short: ${n} characters, at least ${R.cards.min_chars}`);
  if(n>R.cards.max_chars) issues.push(`too long: ${n} characters, at most ${R.cards.max_chars}`);
  R.cards.sections.forEach(sec=>{ if(!new RegExp("^[ \\t]*"+sec.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[ \\t]*:","im").test(t)) issues.push(`missing section: ${sec}`); });

}
function parseSynonyms(card){
  const m=String(card||"").match(/^[ \t]*SYNONYMS[ \t]*:[ \t]*(.*)$/im); if(!m) return [];

const STOP=new Set("the and for with that this from are was were has have had not but its into our their than then they them what when which will would shall can could about over under after before also more most such only other some each per any all".split(" "));
const toks = t => (String(t).toLowerCase().match(/[a-z0-9][a-z0-9.%$-]*[a-z0-9%]|[a-z0-9]/g)||[]).filter(w=>w.length>2&&!STOP.has(w));
function buildChunks(ctx){
  const out=[];
  (ctx.members||[]).forEach(m=>(ctx.att?.[m.id]||[]).forEach(a=>{
    const t=String(a.text||""); const n=Math.max(1,Math.ceil(t.length/CHUNK));
    for(let i=0;i<n;i++){ const tx=t.slice(Math.max(0,i*CHUNK-150),(i+1)*CHUNK); const tf=new Map(); toks(tx).forEach(w=>tf.set(w,(tf.get(w)||0)+1));
      out.push({tag:a.tag,name:a.name,part:i+1,of:n,owner:m.id,shared:!!a.shared,text:tx,tf}); }
  }));

}
function searchChunks(scope, q, k){
  const qs=[...new Set(toks(q))]; if(!qs.length) return [];
  const N=scope.length||1, df={}; qs.forEach(w=>df[w]=scope.reduce((n,c)=>n+(c.tf.has(w)?1:0),0));
  const phrase=String(q).toLowerCase().trim();
  return scope.map(c=>{ let sc=0; qs.forEach(w=>{ const f=c.tf.get(w)||0; if(f) sc+=(1+Math.log(f))*Math.log(1+N/(df[w]||1)); });
      if(phrase.length>5 && c.text.toLowerCase().includes(phrase)) sc+=3; return {c,sc}; })
    .filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,k).map(x=>x.c);
}
function toolsFor(ctx, who, key, onNote){

function computePairings(ctx, round){
  const opts=options(ctx.s,ctx.pack).map(o=>o.toLowerCase());

  const prev = new Set(); for(let r=1;r<round;r++){ const p=ctx.s.pairings?.["challenge"+r]||{}; Object.entries(p).forEach(([a,b])=>prev.add(a+">"+b)); }
  const opp=id=>ctx.members.find(x=>x.id===id)?.opponents||[];
  const has=(list,a,b)=>list.some(x=>Array.isArray(x)?((x[0]===a&&x[1]===b)||(x[0]===b&&x[1]===a)):((x.a===a&&x.b===b)||(x.a===b&&x.b===a)));
  const score=(a,b)=>{ const sa=stanceMap(ctx,a), sb=stanceMap(ctx,b); let d=0; opts.forEach(o=>d+=Math.abs((sa[o]??PR.default_stance)-(sb[o]??PR.default_stance)));

        ].join("\n\n")+(vt?TOOL_NOTE_JSON:""),{json:true,signal:ctx.ctl.signal,tools:vt});

    state.live[LK(ctx.sid,id)]={id,sid:ctx.sid,stage:"synthesis",speaker:"counsel",text:"Drafting the record of decision…",sealed:true}; render();

      T("synthesis",{fact_rules:FACT_RULES})].join("\n\n")+(ct?TOOL_NOTE_JSON:""),{tier:"complex",json:true,signal:ctx.ctl.signal,tools:ct});
    const turn={id,stage:"synthesis",slot:0,speaker:"counsel",text:String(r?.summary||""),meta:r||{},at:Date.now()};
    delete state.live[LK(ctx.sid,id)]; ctx.turns.set(id,turn); await Store.putTurn(ctx.sid,turn);
    s.synthesis={resolution:r?.resolution||"",paths:(r?.paths||[]).map(p=>p.name),risks:(r?.risks||[]).slice(0,3),label:s.outcome?.scoring?.label||"",score:s.outcome?.scoring?.score??null,rec:s.outcome?.scoring?.rec||""};

function normChoice(c, opts){
  const t=String(c||"").trim(); if(!t) return "Hold";
  const hit=opts.find(o=>o.toLowerCase()===t.toLowerCase()) || opts.find(o=>t.toLowerCase().includes(o.toLowerCase())||o.toLowerCase().includes(t.toLowerCase()));
  return hit || (/hold/i.test(t)?"Hold":t);
}
/* SPEC:SCORE:BEGIN */
/* Pure verdict arithmetic, mirrored by scripts/score.py; tests/test_app_score.mjs runs this block against tests/fixtures.
   votes: [{id, title, v}] (v = the vote JSON); weights: {id:{w}}; rat: {id:{vote, final_score}} or {}; R: RULES. */
function scoreVotes(votes, weights, rat, R, allIds){
  const num = x => typeof x==="number" ? x : (typeof x==="string" && x.trim()!=="" ? Number(x) : NaN);
  const r1 = x => Math.floor(x*10+0.5)/10;
  const W = id => Math.min(R.weights.max, Math.max(R.weights.min, Math.round(num(weights?.[id]?.w)||R.weights.default)));
  const V = (votes||[]).filter(x=>x && x.v && x.v.scores && typeof x.v.scores==="object");
  if(!V.length) return null;
  rat = rat||{};
  const title = id => V.find(x=>x.id===id)?.title || id;
  const keys=[...new Set(V.flatMap(x=>Object.keys(x.v.scores)))], options={};
  keys.forEach(k=>{ let n=0,d=0; const parts=[], per=[];
    V.forEach(({id,v})=>{ const sc=num(v.scores[k]); if(Number.isFinite(sc)){ const w=W(id); n+=w*sc; d+=w; parts.push(`${w}×${sc}`); per.push(sc); } });
    options[k]={score:d?r1(n/d):0, math:`(${parts.join(" + ")}) / ${d}`, spread:per.length?Math.max(...per)-Math.min(...per):0}; });
  const ranked=Object.keys(options).sort((a,b)=>options[b].score-options[a].score);
  const rec=ranked[0], score=options[rec].score, spread=options[rec].spread, hold=String(rec).toLowerCase()==="hold";
  const O=R.verdict.order, C=R.caps, caps=[], codes=[];
  let label = hold ? R.verdict.hold_label : (R.verdict.bands.find(b=>score>=b.min)?.label || R.verdict.floor_label);
  const capTo=(to,code,why)=>{ if(!hold && O.indexOf(label)>O.indexOf(to)) label=to; caps.push(why); codes.push(code); };
  const note=(code,why)=>{ caps.push(why); codes.push(code); };
  const norm=x=>String(x??"").trim().toLowerCase().replace(/[\s-]+/g,"_");
  const flagged=(field,val)=>V.filter(x=>String(x.v[field]?.[rec]??"").toLowerCase()===val).map(x=>x.id);
  const redOn=val=>V.filter(x=>norm(x.v.red_line?.[rec])===val).map(x=>x.id);
  const ratified=ids=>Object.keys(rat).length>0 && ids.every(id=>rat[id] && C.ratify_lifting_votes.includes(String(rat[id].vote||"").toLowerCase()));
  const names=ids=>ids.map(title).join(", ");
  const ruin=flagged("ruin_risk",C.ruin.flag);
  if(ruin.length && !hold){
    if(C.ruin.lift_by_ratification && ratified(ruin)) note("ruin_lifted",`Ruin cap lifted: ${names(ruin)} endorsed the resolution's mitigation`);
    else capTo(C.ruin.cap,"ruin",`Ruin cap: ${names(ruin)} flagged likely ruin on "${rec}"`);
  }
  const redBreached=redOn(C.red_line_breached.flag), redAtRisk=redOn(C.red_line_at_risk.flag);
  if(redBreached.length && !hold){
    if(C.red_line_breached.lift_by_ratification && ratified(redBreached)) note("red_breached_lifted",`Red-line cap lifted: ${names(redBreached)} endorsed the resolution's mitigation`);
    else capTo(C.red_line_breached.cap,"red_breached",`Red line breached: ${names(redBreached)} say "${rec}" crosses their red line`);
  }
  if(redAtRisk.length && !hold){
    if(C.red_line_at_risk.lift_by_ratification && ratified(redAtRisk)) note("red_at_risk_lifted",`Red-line cap lifted: ${names(redAtRisk)} endorsed the resolution's mitigation`);
    else capTo(C.red_line_at_risk.cap,"red_at_risk",`Red line at risk: ${names(redAtRisk)} say "${rec}" puts their red line at risk`);
  }
  const oneway=flagged("door",C.one_way_door.flag).length;
  if(!hold && oneway>0 && (!C.one_way_door.needs_majority || oneway>V.length/2) && spread>=C.one_way_door.min_spread)
    capTo(C.one_way_door.cap,"one_way_door",`One-way door: ${oneway} of ${V.length} directors call "${rec}" hard to reverse and scores spread ${spread} points`);
  const K=R.confidence, avg=V.reduce((n,x)=>n+(num(x.v.confidence)||0),0)/V.length;
  const confidence=Math.max(K.min,Math.min(K.max,Math.round(avg/10)-(spread>=K.spread_penalty_at?K.penalty:0)));
  const pillars=V.map(x=>({id:x.id,score:num(x.v.pillar_scores?.[rec])})).filter(p=>Number.isFinite(p.score));
  let support=null; const rk=Object.keys(rat);
  if(rk.length){ let n=0,d=0; rk.forEach(id=>{ const f=num(rat[id]?.final_score); if(Number.isFinite(f)){ n+=W(id)*f; d+=W(id); } }); support=d?r1(n/d):null; }
  return {options, ranked, rec, score, label, caps, cap_codes:codes, spread, confidence, ruin, redBreached, redAtRisk, pillars,
    weak:pillars.filter(p=>p.score<=R.weak_pillar_max).map(p=>p.id), weights:Object.fromEntries((allIds||V.map(x=>x.id)).map(id=>[id,W(id)])), support};
}
/* SPEC:SCORE:END */
function scoreBoard(s, turns){
  const M=members(s), find=id=>turns.find(t=>t.id===id), rat={};
  M.forEach(m=>{ const r=find("ratify__"+m.id); if(r) rat[m.id]=r.meta; });
  return scoreVotes(M.map(m=>({id:m.id,title:m.title,v:find("vote__"+m.id)?.meta})), s.calibration?.weights||{}, rat, RULES, M.map(m=>m.id));
}
function scoringText(sc){
  if(!sc) return "";
  return `WEIGHTED SCORES (director weight × score):\n${sc.ranked.map(k=>`  ${k}: ${sc.options[k].score} = ${sc.options[k].math}, spread ${sc.options[k].spread}`).join("\n")}\nRecommended: ${sc.rec} · verdict ${sc.label}${sc.caps.length?`\nCaps and overrides: ${sc.caps.join("; ")}`:""}\nSpread on the recommended option: ${sc.spread} · council confidence ${sc.confidence}/10${sc.weak.length?`\nWeak pillars (${RULES.weak_pillar_max} or below) on the recommendation: ${sc.weak.map(id=>byId[id]?.title||id).join(", ")}`:""}${(sc.redBreached||[]).length?`\nRed line breached on the recommendation: ${sc.redBreached.map(id=>byId[id]?.title||id).join(", ")}`:""}${(sc.redAtRisk||[]).length?`\nRed line at risk on the recommendation: ${sc.redAtRisk.map(id=>byId[id]?.title||id).join(", ")}`:""}${sc.support!=null?`\nSupport for the resolution: ${sc.support}/10`:""}`;
}
function cruxText(ctx){
  const c=ctx.turns.get("cruxes__counsel")?.meta?.cruxes||[]; if(!c.length) return "";
  const t=ids=>(ids||[]).map(id=>byId[id]?.title||id).join(", ");
  return "THE CRUXES THE COUNSEL SEES:\n"+c.map((x,i)=>`${i+1}. ${x.question} [${x.type}] — ${x.side_a?.position||""} (${t(x.side_a?.directors)}) vs ${x.side_b?.position||""} (${t(x.side_b?.directors)})`).join("\n");
}
const redOf = x => String(x??"").trim().toLowerCase().replace(/[\s-]+/g,"_");
function redFlags(v){ return Object.entries(v?.red_line||{}).filter(([,x])=>["at_risk","breached"].includes(redOf(x))).map(([k,x])=>`${k}: ${redOf(x).replace("_"," ")}`); }
function redText(v){ const f=redFlags(v); return f.length?` Red line: ${f.join("; ")}.`:""; }
function rollText(ctx){ return "ROLL CALL:\n"+ctx.members.map(x=>{ const v=ctx.turns.get("vote__"+x.id)?.meta||{}; return `${x.id} (${x.title}): ${v.choice} — ${v.support}, confidence ${v.confidence}. Conditions: ${(v.conditions||[]).join("; ")}. Flips if: ${v.flip_if}.${redText(v)}`; }).join("\n"); }
function ratifyText(ctx){
  const r=ctx.members.map(m=>[m,ctx.turns.get("ratify__"+m.id)?.meta]).filter(x=>x[1]); if(!r.length) return "";
  return "DRAFT RESOLUTION:\n"+(ctx.turns.get("draft__counsel")?.text||"")+"\nRATIFICATION:\n"+r.map(([m,v])=>`${m.id} (${m.title}): ${v.vote}, support ${v.final_score}/10${v.amendment?`. Amendment/dissent: ${v.amendment}`:""}`).join("\n");
}
function tally(s, turns){
  const votes=members(s).map(m=>turns.find(t=>t.id==="vote__"+m.id)).filter(Boolean);
  const counts={}; let conf=0, strong=0;
  votes.forEach(v=>{ const c=v.meta.choice||"Hold"; counts[c]=(counts[c]||0)+1; conf+=+v.meta.confidence||0; if(v.meta.support==="strong") strong++; });
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  return {counts:Object.fromEntries(sorted), leader:sorted[0]?.[0]||"", lead:sorted[0]?.[1]||0, tie:sorted.length>1&&sorted[0][1]===sorted[1][1], cast:votes.length, strong, avgConf:votes.length?Math.round(conf/votes.length):0,
    byMember:Object.fromEntries(votes.map(v=>[v.speaker,{choice:v.meta.choice,support:v.meta.support,confidence:v.meta.confidence}]))};
}

async function runDebate(sid, mode){
  if(RUN) return;
  const s0=getS(sid); if(!s0) return;
  if(!state.pack){ showNotice("The evidence pack hasn't arrived yet. The board convenes only on sourced research."); return; }
  const ctx={sid,s:clone(s0),pack:state.pack,turns:new Map(state.turns.map(t=>[t.id,t])),ctl:new AbortController(),mode};
  if(!ctx.s.plan){
    let seat=members(ctx.s);
    if(seat.length<MIN_SEATS){ showNotice(`Seat at least ${MIN_SEATS} directors before convening.`); return; }
    if(ctx.s.depth==="quick" && seat.length>RULES.QUICK_SEATS){
      ctx.members=seat;
      if(seat.some(m=>!ctx.s.calibration?.weights?.[m.id])){ try{ await calibrate(ctx); }catch(e){ showNotice(errCopy(e)); return; } }
      const w=id=>+(ctx.s.calibration?.weights?.[id]?.w)||2;
      seat=seat.map((m,i)=>({m,i})).sort((a,b)=>(w(b.m.id)-w(a.m.id))||(a.i-b.i)).slice(0,RULES.QUICK_SEATS).sort((a,b)=>a.i-b.i).map(x=>x.m);
    }
    ctx.s.board = seat.map(p=>{ const o={id:p.id,custom:!!p.custom}; PFIELDS.forEach(k=>o[k]=p[k]); return o; });
    ctx.s.seats = seat.map(p=>p.id);
    ctx.s.rounds=roundsFor(ctx.s.depth); ctx.s.plan=buildPlan(ctx.s.rounds,!!ctx.s.ratify,ctx.s.depth); ctx.s.next=0; }
  ctx.members = members(ctx.s); registerPeople(ctx.members); ctx.att={};
  RUN=ctx; ctx.s.status="running"; ctx.s.error=""; state.notice=""; await saveS(ctx); render();
  try{
    for(const m of ctx.members){ try{ ctx.att[m.id]=await loadMaterials(m.id); }catch(_){ ctx.att[m.id]=[]; } }
    ctx.chunks=buildChunks(ctx); ctx.lookups={};
    if(ctx.members.some(m=>!ctx.s.calibration?.lenses?.[m.id])) await calibrate(ctx);
    while(ctx.s.next < ctx.s.plan.length){
      await runStage(ctx, ctx.s.plan[ctx.s.next]);
      ctx.s.next++; await saveS(ctx);
      if(mode==="step" && ctx.s.next<ctx.s.plan.length) break;
    }
    ctx.s.status = ctx.s.next>=ctx.s.plan.length ? "complete" : "adjourned";
  }catch(e){
    ctx.ctl.abort();
    if(e&&e.code==="cancelled"){ ctx.s.status="adjourned"; }
    else { ctx.s.status="interrupted"; ctx.s.error=errCopy(e); }
  }finally{
    Object.keys(state.live).forEach(k=>{ if(state.live[k].sid===ctx.sid) delete state.live[k]; });
    await saveS(ctx); RUN=null; render();
  }
}
async function calibrate(ctx){
  const s=ctx.s, lk=LK(ctx.sid,"calibrate");
  state.live[lk]={id:"calibrate",sid:ctx.sid,stage:"plan",speaker:"counsel",text:""}; render();
  try{
    const r = await ask([COUNSEL_FRAME, profileText(s), `GROWTH AREA: ${s.growthArea}`, `QUESTION: ${s.question}`,
      T("calibrate",{calibration_schema:calibSpec(ctx.members)})].join("\n\n"),
      {tier:"default",json:true,signal:ctx.ctl.signal});
    const c = r?.calibration || r;
    if(c?.lenses){ s.calibration={themes:(c.themes&&c.themes.length?c.themes:s.calibration?.themes)||[],lenses:{...(s.calibration?.lenses||{}),...c.lenses},weights:{...(s.calibration?.weights||{}),...(c.weights||{})}}; await saveS(ctx); }
  } finally { delete state.live[lk]; }
}
function stopRun(){ if(RUN) RUN.ctl.abort(); }

async function rewindTo(sid, key, opts={}){
  if(RUN) return;
  const s=clone(getS(sid)); if(opts.addRound){ s.rounds=(s.rounds||1)+1; s.plan=buildPlan(s.rounds,!!s.ratify,s.depth); }
  const i = opts.addRound ? s.plan.indexOf("challenge"+s.rounds) : s.plan.indexOf(key);
  if(i<0) return;
  const cut = i;
  const doomed = state.turns.filter(t=>{ const k=s.plan.indexOf(t.stage); return k<0 || k>=cut; });
  for(const t of doomed) await Store.delTurn(sid,t.id);
  s.next = Math.min(s.next??0, i);
  s.skipped=(s.skipped||[]).filter(k=>s.plan.indexOf(k)<cut);
  Object.keys(s.pairings||{}).forEach(k=>{ if(s.plan.indexOf(k)>=cut) delete s.pairings[k]; });
  if(s.plan.indexOf("vote")>=cut){ delete s.outcome; delete s.synthesis; }
  s.status="adjourned"; s.updatedAt=Date.now();
  await Store.putSession(sid,s);
}

function draw(){
  drawRail();
  setHTML(document.getElementById("banner"), Store.kind==="memory" ? `<div class="notice bad"><b>Saving is unavailable.</b> Directors, data and sessions will be lost when this page reloads.</div>` : "");
  const main=document.getElementById("main");

function drawRail(){
  const h=document.getElementById("hist");
  const cmp=state.view==="compare";
  let html=`<h3>${cmp?"Select sessions to compare":"Session history"}</h3>`;
  if(!state.booted) html+=`<div class="empty-note">Loading board records…</div>`;
  else if(!state.sessions.length) html+=`<div class="empty-note">No sessions yet. Each dilemma you convene is saved here with its evidence, transcript and votes.</div>`;

function readIntake(){

  const seats=[...document.querySelectorAll('input[name=seat]:checked')].map(x=>x.value);
  return {seats,company:v("f-company"),sector:v("f-sector"),geography:v("f-geo"),growthArea:v("f-growth"),title:v("f-title")||v("f-growth"),question:v("f-question")||`Which markets within ${v("f-growth")} should we pursue first?`,
    markets,context:v("f-context"),constraints:v("f-constraints"),assumptions:v("f-assumptions"),notes:v("f-notes"),
    depth:document.querySelector('input[name=depth]:checked')?.value||"standard", ratify:!!document.getElementById("f-ratify")?.checked};

async function createSession(startPlan){
  const f=readIntake(); if(!f.growthArea){ document.getElementById("f-growth").focus(); return; }
  if(f.seats.length<MIN_SEATS||f.seats.length>MAX_SEATS){ showNotice(`Seat between ${MIN_SEATS} and ${MAX_SEATS} directors.`); return; }
  state.notice="";
  if(startPlan && !SAMPLE){ showNotice("Claude isn't available in this view."); return; }
  const id=newId("s"); const now=Date.now();
  const s={...f,status:"draft",createdAt:now,updatedAt:now};
  state.pending[id]={id,...s}; await Store.putSession(id,s);
  state.draft=null; openSession(id);
  if(startPlan) runPlan(id,{id,...s});
}

function openSession(id){
  state.view="session"; state.sid=id; state.turns=[]; state.pack=null; state.notice=""; state.evMarket=0; state.armed=null;
  unsubTurns&&unsubTurns(); unsubPack&&unsubPack();
  unsubTurns=Store.watchTurns(id,t=>{ state.turns=t; render(); });
  unsubPack=Store.watchPack(id,p=>{ state.pack=p; maybeMarkEvidence(); render(); });
  try{ history.replaceState(null,"","#"+id); }catch(e){}
  render();
}
async function maybeMarkEvidence(){
  const s=curS(); if(!s||!state.pack||RUN) return;
  if(s.status==="research_requested"||s.status==="plan_ready"){ const n=clone(s); n.status="evidence_ready"; n.updatedAt=Date.now(); await Store.putSession(s.id,n); }
}

function pipelineHTML(s){

  pre.forEach(([l,d,n])=>items.push(`<span class="pi ${d?"done":n?"now":""}">${l}</span>`));
  const plan=s.plan||buildPlan(roundsFor(s.depth),!!s.ratify,s.depth), next=s.plan?s.next:0;
  plan.forEach((k,i)=>{ const skip=(s.skipped||[]).includes(k); const live=RUN&&RUN.sid===s.id&&i===next&&s.plan;
    items.push(`<span class="pi ${skip?"skip":(s.plan&&i<next)?"done":live?"now":""}">${esc(stageInfo(k).short)}</span>`); });

}

function controlsHTML(s,st,running){
  const can=CAN_WRITE&&!!SAMPLE&&!RUN;

    if(st==="plan_ready") btns.push(`<button class="btn" data-act="plan" ${can?"":"disabled"}>Regenerate plan</button>`);
    if(state.pack && (s.plan ? s.next<s.plan.length : true)){
      const started=!!s.plan;
      btns.push(`<button class="btn primary" data-act="run" ${can?"":"disabled"}>${started?"Continue to the decision":"Convene the board"}</button>`);
      btns.push(`<button class="btn" data-act="step" ${can?"":"disabled"}>${started?"Run next stage only":"Run first stage only"}</button>`);

      btns.push(`<span class="row" style="gap:6px"><label class="muted" for="regen">Regenerate from</label><select id="regen" class="btn sm" style="font-weight:500">${done.map(k=>`<option value="${esc(k)}">${esc(stageInfo(k).label)}</option>`).join("")}</select>

async function extractText(file){

async function runConsult(){

  const p=persona(state.dirId), q=document.getElementById("cs-q")?.value.trim(), sid=document.getElementById("cs-session")?.value||"";

  if(sid){ try{ pack=(await Store.list(`sessions/${sid}/evidence`)).find(x=>x.id==="pack")||null; }catch(_){} }
  const s = sess ? {...sess, board:null, seats:[p.id]} : {seats:[p.id]};
  const ctx={members:[p], att:{}, lookups:{}}; try{ ctx.att[p.id]=await loadMaterials(p.id); }catch(_){ ctx.att[p.id]=[]; } ctx.chunks=buildChunks(ctx);
  state.consultLive={dir:p.id,text:"",note:""}; state.consultCtl=new AbortController(); state.notice=""; render();
  ATT_CTX=ctx;
  try{
    const tools=toolsFor(ctx,p.id,"consult",msg=>{ if(state.consultLive){ state.consultLive.note=msg; render(); } });
    const after=x=>{ const i=x.lastIndexOf("<<<REMARKS"); return i<0?(tools?"":x):x.slice(i+10); };
    const prompt=[memberFrame(p,s), sess?[contextBlock(sess),dossier(sess,pack),evidenceText(pack)].join("\n\n"):"",
      `QUESTION FROM THE CHAIR:\n${q}`,

    const r=await ask(prompt,{tier:"default",signal:state.consultCtl.signal,tools,onText:t=>{ if(state.consultLive){ state.consultLive.text=after(t); render(); } }});
    const a=tools&&r.text.includes("<<<REMARKS")?after(r.text):r.text;
    await Store.put(`directors/${p.id}/consults`, newId("c"), {q,a:a.trim(),at:Date.now(),sessionId:sid||null,sessionTitle:sess?.title||""});
    const box=document.getElementById("cs-q"); if(box) box.value="";
  }catch(e){ if(e?.code!=="cancelled") state.notice=errCopy(e); }

}

const GUIDE_STEPS = [
  {lane:0,t:"Describe the company and decision",d:"Company, sector, geography, question"},

function guideSVG(){
  const W=960, laneW=300, gap=15, x0=15, top=70, rowH=92, bw=250, bh=60;
  const cx=l=>x0+l*(laneW+gap)+laneW/2;
  const H=top+GUIDE_STEPS.length*rowH+10;
  const lanes=["You","Board app","Claude chat (web research)"];
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Flowchart: you describe the decision, the app's Counsel proposes an analysis plan you approve, research runs in a Claude chat and writes an evidence pack back to the app, you convene the board, the app runs the debate, vote and synthesis, and you review, add rounds, or compare sessions." style="width:100%;min-width:760px;height:auto;display:block;font-family:var(--f-display)">
  <defs><marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker>
  <marker id="gl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/></marker></defs>`;
  lanes.forEach((l,i)=>{ const x=x0+i*(laneW+gap);
    o+=`<rect x="${x}" y="10" width="${laneW}" height="${H-20}" rx="8" style="fill:${i===1?"var(--accent-soft)":"var(--sunk)"};opacity:${i===1?.55:.7}"/>
    <text x="${x+laneW/2}" y="40" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700;letter-spacing:.06em">${esc(l.toUpperCase())}</text>`; });
  const pos=GUIDE_STEPS.map((s,i)=>({x:cx(s.lane)-bw/2,y:top+i*rowH,cx:cx(s.lane)}));
  // connectors
  GUIDE_STEPS.forEach((s,i)=>{ if(i===0) return; const a=pos[i-1], b=pos[i];
    const y1=a.y+bh, y2=b.y, ym=y1+(y2-y1)/2;
    const d = a.cx===b.cx ? `M${a.cx},${y1} L${b.cx},${y2-2}` : `M${a.cx},${y1} L${a.cx},${ym} L${b.cx},${ym} L${b.cx},${y2-2}`;
    o+=`<path d="${d}" style="fill:none;stroke:var(--muted);stroke-width:1.4" marker-end="url(#ga)"/>`;
    if(s.in){ const lx = a.cx===b.cx ? a.cx+8 : (a.cx+b.cx)/2; const ly = a.cx===b.cx ? ym+4 : ym-6;
      o+=`<text x="${lx}" y="${ly}" text-anchor="${a.cx===b.cx?"start":"middle"}" style="fill:var(--muted);font-size:11.5px;font-family:var(--f-mono)">${esc(s.in)}</text>`; }
  });
  // loops
  GUIDE_STEPS.forEach((s,i)=>{ if(!s.loop) return; const a=pos[i], b=pos[s.loop.to];
    const sx=a.x+bw, sy=a.y+bh/2, tx=b.x+bw, ty=b.y+bh/2;
    const rx = a.cx===b.cx ? Math.max(sx,tx)+28 : cx(GUIDE_STEPS[s.loop.to].lane)+laneW/2+gap/2;
    const d = `M${sx},${sy} L${rx},${sy} L${rx},${ty} L${tx+2},${ty}`;
    o+=`<path d="${d}" style="fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:5 4" marker-end="url(#gl)"/>`;
    const lx = rx+5, ly = (sy+ty)/2;
    o+=`<text x="${lx}" y="${ly}" text-anchor="start" style="fill:var(--accent);font-size:11.5px;font-family:var(--f-mono)">${esc(s.loop.label)}</text>`;
  });
  // boxes
  GUIDE_STEPS.forEach((s,i)=>{ const p=pos[i];
    o+=`<rect x="${p.x}" y="${p.y}" width="${bw}" height="${bh}" rx="6" style="fill:var(--surface);stroke:${s.lane===1?"var(--accent)":"var(--line)"};stroke-width:1.2"/>
    <circle cx="${p.x+18}" cy="${p.y+20}" r="10" style="fill:${s.lane===0?"var(--ink)":s.lane===1?"var(--accent)":"var(--c-counsel)"}"/>
    <text x="${p.x+18}" y="${p.y+24}" text-anchor="middle" style="fill:var(--surface);font-size:11px;font-weight:700;font-family:var(--f-mono)">${i+1}</text>
    <text x="${p.x+36}" y="${p.y+25}" style="fill:var(--ink);font-size:13.5px;font-weight:650">${esc(s.t)}</text>
    <text x="${p.x+14}" y="${p.y+46}" style="fill:var(--muted);font-size:11.5px">${esc(s.d)}</text>`; });
  return o+"</svg>";
}

async function exportBoard(){

async function readImport(file){
  let data; try{ data=JSON.parse(await file.text()); }catch(_){ showNotice("That file isn't valid JSON."); return; }
  if(!data || !Array.isArray(data.directors)){ showNotice("That file isn't a board export (no directors list)."); return; }
  const dirs=data.directors.filter(d=>d&&d.id&&d.title), mats=(data.materials||[]).filter(m=>m&&m.director_id&&m.tag);
  const ids=new Set(dirs.map(d=>String(d.id))), known=id=>!!persona(id);
  const clash=dirs.filter(d=>!known(d.id)).map(d=>({d,other:rosterList(true).find(p=>p.mono===d.mono&&p.id!==d.id)})).filter(x=>x.other||x.d.mono==="SC");
  const matDirs=new Set(mats.map(m=>m.director_id));
  for(const id of matDirs){ if(known(id)&&!state.atts[id]){ try{ state.atts[id]=await loadMaterials(id); }catch(_){ state.atts[id]=[]; } } }
  const hasTag=(id,tag)=>(state.atts[id]||[]).some(a=>a.tag===tag);
  state.importPlan={data, name:file.name, dirs, mats:mats.filter(m=>ids.has(m.director_id)||known(m.director_id)),
    overDirs:dirs.filter(d=>known(d.id)), newDirs:dirs.filter(d=>!known(d.id)), skipDirs:clash.map(x=>x.d.id),
    clashNote:clash.map(x=>`${x.d.title} (monogram ${x.d.mono} is taken${x.other?" by the "+x.other.title:""})`)};
  const P=state.importPlan; P.mats=P.mats.filter(m=>!P.skipDirs.includes(m.director_id));
  P.overMats=P.mats.filter(m=>known(m.director_id)&&hasTag(m.director_id,m.tag)); P.newMats=P.mats.filter(m=>!P.overMats.includes(m));
  state.notice=""; render();
}

async function applyImport(overwrite){
  const P=state.importPlan; if(!P) return; state.importPlan=null;
  const colorFor=(d,cur)=>{ const hit=Object.entries(COLOR_HEX).find(([,h])=>d.color&&h.light&&String(h.light).toLowerCase()===String(d.color.light||"").toLowerCase()); return hit?hit[0]:(cur||nextColor()); };
  let nd=0, od=0, nm=0, om=0;
  for(const d of P.dirs){
    if(P.skipDirs.includes(d.id)) continue;
    const cur=persona(d.id); if(cur && !overwrite) continue;
    const fields={title:d.title, mono:String(d.mono||initials(d.title)).toUpperCase().slice(0,3), color:colorFor(d,cur?.color), lens:d.lens||"", mandate:d.mandate||"",
      presses:lines(d.presses).join("\n"), redLine:d.redLine||"", thresholds:d.thresholds||"", blindSpots:d.blindSpots||"", tone:d.tone||"",
      pestle:(Array.isArray(d.pestle)?d.pestle:String(d.pestle||"").split(/\s*,\s*/)).filter(Boolean).join(", "), opponents:(d.opponents||[]).map(String), archived:!!d.archived, active:d.active!==false};
    if(DEFAULT_IDS.includes(d.id)) await saveDir(d.id, fields);
    else await Store.put("directors", d.id, {...(state.dirs[d.id]||{}), ...fields, custom:true, createdAt:state.dirs[d.id]?.createdAt||Date.now(), updatedAt:Date.now()});
    cur?od++:nd++;
  }
  const byDir={};
  for(const m of P.mats){
    if(!persona(m.director_id) && !P.dirs.some(d=>d.id===m.director_id)) continue;
    const exists=(state.atts[m.director_id]||[]).find(a=>a.tag===m.tag);
    if(exists){ if(!overwrite) continue; await deleteMaterial(m.director_id, exists); om++; } else nm++;
    (byDir[m.director_id]=byDir[m.director_id]||[]).push({name:m.name||m.tag, kind:["file","card"].includes(m.kind)?m.kind:(m.card_for?"card":"text"), cardFor:m.card_for||undefined, text:String(m.text||""), tag:m.tag, shared:!!m.shared, pinned:!!m.pinned, asOf:m.as_of||"", addedAt:timeOf(m.added_at)});
  }
  for(const [id,items] of Object.entries(byDir)) await addAttachments(id, items, P.dirs.find(d=>d.id===id)?.mono);
  state.notice=`Imported: ${nd} new director(s), ${od} updated; ${nm} new material(s), ${om} replaced.`; render();
}

/* ───────────────────────── Print and report ───────────────────────── */
/* Printing renders every market's evidence, opens every <details> and forces the light theme, then restores the view. */
let PRINT_RESTORE=null;
function preparePrint(){
  if(PRINT_RESTORE) return;
  const root=document.documentElement, theme=root.getAttribute("data-theme"), s=curS();
  const ev=document.getElementById("sv-evidence"); if(s&&ev&&state.pack){ ev.innerHTML=evidenceHTML(s,true); ev._h=null; }
  const closed=[...document.querySelectorAll("#main details:not([open])")]; closed.forEach(d=>d.open=true);
  root.setAttribute("data-theme","light");
  PRINT_RESTORE=()=>{ closed.forEach(d=>d.open=false); theme==null?root.removeAttribute("data-theme"):root.setAttribute("data-theme",theme); PRINT_RESTORE=null; render(); };
}
window.addEventListener("beforeprint", preparePrint);
window.addEventListener("afterprint", ()=>PRINT_RESTORE&&PRINT_RESTORE());
function printSession(){
  preparePrint();
  try{ window.print(); }catch(_){ PRINT_RESTORE&&PRINT_RESTORE(); showNotice("Printing isn't available in this view. Use Download report, open the file, and print it."); }
}
function reportHTML(s){
  const css=[...document.querySelectorAll("style")].map(x=>x.textContent).find(t=>t.includes("--f-display"))||"";
  const body=[`<div class="eyebrow">Minutes of the board · ${esc(fmtDate(s.createdAt))} · ${esc(s.depth==="deep"?"Deep":s.depth==="quick"?"Quick":"Standard")} session</div><h1>${esc(s.title)}</h1><p class="lede">${esc(s.question)}</p>
    <div class="muted">${[s.company,s.sector,s.geography].filter(Boolean).map(esc).join(" · ")}${s.growthArea?` · Growth area: <b>${esc(s.growthArea)}</b>`:""}</div>`,
    `<div class="sec">${rosterHTML(s)}</div>`, votesHTML(s), synthHTML(s), transcriptHTML(s), evidenceHTML(s,true)].join("\n").replace(/<details(?![^>]*\bopen\b)/g,"<details open");
  return `<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(s.title)} · board report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>${css}
body{margin:0} .main{margin:0 auto} .btn,.mkt-chips{display:none!important}</style></head>
<body><main class="main">${body}
<p class="muted" style="margin-top:32px;font-size:12px">Generated by the Strategy Boardroom on ${esc(new Date().toLocaleString())}. Print this page or save it as PDF from your browser.</p></main></body></html>`;
}
async function downloadReport(){
  const s=curS(); if(!s) return;
  const text=reportHTML(s), filename=(String(s.title||"session").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"session")+"-board-report.html";
  const dl=await use("downloads");
  if(dl){ try{ await dl.save({filename,data:text}); state.notice="Report saved. Open it in your browser and print or save as PDF."; }
    catch(e){ state.notice = e?.code==="declined" ? "Download cancelled." : `Couldn't save the report (${e?.code||"error"}).`; } }
  else { try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/html"})); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); state.notice="Report downloaded. Open it and print or save as PDF."; }
    catch(_){ state.notice="Downloads aren't available in this view."; } }
  render();
}

/* ───────────────────────── Events ───────────────────────── */
document.addEventListener("change",async e=>{
  if(e.target.name==="sseat"){ const s=curS(); if(!s||s.plan) return; const box=e.target.closest(".seats");
    const ids=[...box.querySelectorAll('input[name=sseat]:checked')].map(x=>x.value);
    if(ids.length<MIN_SEATS||ids.length>MAX_SEATS){ e.target.checked=!e.target.checked; showNotice(`Seat between ${MIN_SEATS} and ${MAX_SEATS} directors.`); return; }
    const n=clone(s); n.seats=ids; n.updatedAt=Date.now(); state.notice=""; await Store.putSession(s.id,n); return; }
  if(e.target.id==="board-file" && e.target.files?.[0]){ const f=e.target.files[0]; e.target.value=""; await readImport(f); return; }
  if(e.target.id==="f-copy" && e.target.value){ const src=getS(e.target.value); if(src) fillIntake({company:src.company,sector:src.sector,geography:src.geography,context:src.context,constraints:src.constraints}); }
});
function fillIntake(o){
  const map={company:"f-company",sector:"f-sector",geography:"f-geo",growthArea:"f-growth",question:"f-question",markets:"f-markets",context:"f-context",constraints:"f-constraints",assumptions:"f-assumptions",title:"f-title"};
  Object.entries(map).forEach(([k,id])=>{ if(o[k]!=null){ const el=document.getElementById(id); if(el) el.value=Array.isArray(o[k])?o[k].join("\n"):o[k]; } });
}
document.addEventListener("input",e=>{
  if(e.target.id==="card-text" && state.cardDraft){ state.cardDraft.draft=e.target.value; const c=document.getElementById("card-check"); if(c) c.innerHTML=cardCheckText(validateCard(e.target.value,RULES)); }
});
document.addEventListener("submit",e=>{ e.preventDefault(); if(e.target.id==="intake") createSession(true); });
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, s=curS();
  if(!["regen","delete","dir-delete","dir-reset","att-del"].includes(act)) state.armed=null;
  switch(act){
    case "new": state.backSid=null; state.view="intake"; state.sid=null; try{history.replaceState(null,"","#new");}catch(_){} render(); break;
    case "compare": state.view="compare"; state.sid=null; render(); break;
    case "guide": e.preventDefault(); state.view="guide"; state.sid=null; try{history.replaceState(null,"","#guide");}catch(_){} render(); break;
    case "example": fillIntake({...EXAMPLE}); break;
    case "board": e.preventDefault(); if(state.view==="session"&&state.sid) state.backSid=state.sid; state.view="board"; state.sid=null; state.dirId=null; state.notice=""; render(); break;
    case "back-session": { const id=state.backSid; state.backSid=null; if(id&&getS(id)) openSession(id); else { state.view="board"; render(); } break; }
    case "dir-new": state.view="director"; state.sid=null; state.dirId="new"; state.dirColor=nextColor(); state.notice=""; render(); break;
    case "dir-edit": state.view="director"; state.sid=null; state.dirId=el.dataset.id; state.dirColor=persona(el.dataset.id)?.color; state.notice=""; render(); break;
    case "consult": { const id=el.dataset.id; state.view="consult"; state.sid=null; state.dirId=id; state.notice="";
      if(!state.consultSubs[id]) state.consultSubs[id]=Store.watchCol(`directors/${id}/consults`, l=>{ state.consults[id]=l.sort((a,b)=>(b.at||0)-(a.at||0)); render(); }); render(); break; }
    case "consult-ask": await runConsult(); break;
    case "consult-stop": state.consultCtl?.abort(); break;
    case "dir-cancel": state.view="board"; state.dirId=null; render(); break;
    case "dir-active": { const p=persona(el.dataset.id); if(p) await saveDir(p.id,{active:p.active===false}); break; }
    case "dir-restore": await saveDir(el.dataset.id,{archived:false}); break;
    case "dir-remove": await saveDir(state.dirId,{archived:true}); state.view="board"; state.dirId=null; render(); break;
    case "swatch": state.dirColor=el.dataset.c; document.querySelectorAll(".swatch").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.c===state.dirColor))); break;
    case "dir-save": await saveDirectorForm(); break;
    case "dir-draft": await draftDirector(el); break;
    case "dir-delete": { if(state.armed!=="dir-delete"){ state.armed="dir-delete"; main_rerender_dir(); break; } state.armed=null; const id=state.dirId;
      for(const a of (state.atts[id]||[])) await deleteMaterial(id,a); await Store.del("directors",id); state.view="board"; state.dirId=null; render(); break; }
    case "dir-reset": { if(state.armed!=="dir-reset"){ state.armed="dir-reset"; main_rerender_dir(); break; } state.armed=null; const id=state.dirId; const o=state.dirs[id];
      if(o){ const keep={}; ["archived","active"].forEach(k=>{ if(o[k]!=null) keep[k]=o[k]; }); await Store.put("directors",id,{builtIn:true,...keep}); } state.dirColor=null; main_rerender_dir(true); break; }
    case "att-upload": await uploadFiles(); break;
    case "print": printSession(); break;
    case "report": await downloadReport(); break;
    case "board-export": state.notice="Preparing the export…"; render(); await exportBoard(); break;
    case "board-import": document.getElementById("board-file")?.click(); break;
    case "import-all": await applyImport(true); break;
    case "import-new": await applyImport(false); break;
    case "import-cancel": state.importPlan=null; render(); break;
    case "att-paste": await pasteAttachment(); break;
    case "att-card": { const a=(state.atts[state.dirId]||[]).find(x=>x.id===el.dataset.id); if(a) queueCards(state.dirId,[{id:a.id,tag:a.tag,name:a.name,text:a.text,shared:a.shared}],true); render(); break; }
    case "card-save": await saveCard(); break;
    case "card-regen": if(state.cardDraft){ const t=document.getElementById("card-text"); if(t) state.cardDraft.draft=t.value; await startNextCard(true); } break;
    case "card-skip": state.cardDraft=null; render(); startNextCard(); break;
    case "att-pin": { const a=(state.atts[state.dirId]||[]).find(x=>x.id===el.dataset.id); if(a) await Store.put(`directors/${state.dirId}/data`,a.id,{...a,pinned:!a.pinned}); break; }
    case "att-share": { const a=(state.atts[state.dirId]||[]).find(x=>x.id===el.dataset.id); if(a) await Store.put(`directors/${state.dirId}/data`,a.id,{...a,shared:!a.shared}); break; }
    case "att-del": { const k="att-del:"+el.dataset.id; if(state.armed!==k){ state.armed=k; render(); break; } state.armed=null; const a=(state.atts[state.dirId]||[]).find(x=>x.id===el.dataset.id); if(a) await deleteMaterial(state.dirId,a); break; }
    case "open": state.backSid=null; openSession(el.dataset.id); break;
    case "cmptoggle": { const s2=getS(el.dataset.id); if(!s2?.outcome) break; state.cmpSel.has(s2.id)?state.cmpSel.delete(s2.id):state.cmpSel.add(s2.id); render(); break; }
    case "savedraft": createSession(false); break;
    case "edit": if(s){ state.draft={...s,markets:(s.markets||[]).join("\n")}; await Store.delSession(s.id,[]); state.view="intake"; state.sid=null; render(); } break;
    case "plan": if(s) runPlan(s.id); break;
    case "approve": if(s) approvePlan(s); break;
    case "copy": { const txt=document.getElementById("cmd")?.textContent||""; try{ await navigator.clipboard.writeText(txt); el.textContent="Copied"; }catch(_){ const r=document.createRange(); r.selectNodeContents(document.getElementById("cmd")); const w=getSelection(); w.removeAllRanges(); w.addRange(r); el.textContent="Selected — press Ctrl+C"; } break; }
    case "evm": state.evMarket=+el.dataset.i; render(); break;
    case "run": if(s) runDebate(s.id,"auto"); break;
    case "step": if(s) runDebate(s.id,"step"); break;
    case "stop": stopRun(); break;
    case "regen": if(!s) break; if(state.armed!=="regen"){ state.armed="regen"; render(); break; } state.armed=null; await rewindTo(s.id, document.getElementById("regen").value); render(); break;
    case "addround": if(s){ await rewindTo(s.id,null,{addRound:true}); render(); } break;
    case "delete": if(!s) break; if(state.armed!=="del"){ state.armed="del"; render(); break; } state.armed=null; await Store.delSession(s.id,state.turns.map(t=>t.id)); state.view="intake"; state.sid=null; render(); break;
  }
});
async function approvePlan(s){
  const p=s.analysisPlan; const markets=[];
  (p.markets||[]).forEach((m,i)=>{ if(document.getElementById("pm-on-"+i)?.checked){ markets.push({...m,name:document.getElementById("pm-name-"+i)?.value.trim()||m.name}); } });
  const add=document.getElementById("pm-add")?.value.trim(); if(add) markets.push({name:add,definition:"Added by the chair",questions:[],data:[],pestle:[]});
  if(!markets.length){ showNotice("Keep at least one market in the plan."); return; }
  const n=clone(s); n.approvedPlan={markets,instructions:document.getElementById("pm-instr")?.value.trim()||"",approvedAt:Date.now()};
  n.status="research_requested"; n.updatedAt=Date.now(); state.notice="";
  await Store.putSession(s.id,n); render();
}

/* ───────────────────────── Boot ───────────────────────── */
(async function boot(){
  render();
  const [smp, usr] = await Promise.all([use("sample"), use("user"), Store.init()]);
  SAMPLE=smp; USER=usr;
  if(SAMPLE){ try{ const lim=await SAMPLE.limits(); state.toolsOK=!!lim?.tools; }catch(_){ state.toolsOK=false; } }
  if(USER){ try{ const c=await USER.can("data.write"); CAN_WRITE = c!==false; }catch(_){} }
  Store.watchCol("directors", list=>{
    state.dirs={}; list.forEach(d=>state.dirs[d.id]=d);
    const all=rosterList(true); registerPeople(all);
    all.forEach(p=>{ if(!state.attSubs[p.id]) state.attSubs[p.id]=Store.watchCol(`directors/${p.id}/data`, l=>{ state.atts[p.id]=l.sort((a,b)=>(a.addedAt||0)-(b.addedAt||0)); rebuildAttIndex(); render(); }); });
    render();
  });
  Store.watchSessions(list=>{
    state.sessions=list; state.booted=true;
    if(!state.sid && state.view==="intake" && !state._hashTried){ state._hashTried=true; const h=(location.hash||"").slice(1); if(h==="guide"){ state.view="guide"; } else if(h && list.some(s=>s.id===h)) { openSession(h); return; } }
    if(state.sid && RUN && RUN.sid===state.sid){ /* runner holds the freshest copy */ }
    render();
  });
  const main=document.getElementById("main"); main.dataset.view=""; render();
})();
</script>
